[project]
name = "medimg"
version = "0.1.0"
description = "AI-assisted chest X-ray triage with Grad-CAM and radiologist review (education only)"
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
