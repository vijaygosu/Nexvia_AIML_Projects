name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install --extra-index-url https://download.pytorch.org/whl/cpu torch torchvision numpy pillow "pydicom>=2.4,<3" fastapi httpx python-multipart requests scikit-learn pytest
      - run: pytest -q
  viewer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: cd viewer && npm install && npm run build
