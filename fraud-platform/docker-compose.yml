services:
  kafka:
    image: apache/kafka:3.8.0
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  api:
    build: .
    ports: ["8000:8000"]
    environment: {KAFKA_BOOTSTRAP: "kafka:9092"}
    volumes: ["fraud-data:/app/data"]
    depends_on: [kafka]
  producer:
    build: .
    command: ["python", "-m", "fraud.service.producer", "--bootstrap", "kafka:9092", "--rate", "50"]
    depends_on: [api]
    profiles: ["replay"]
  dashboard:
    build: {context: ., dockerfile: Dockerfile.dashboard}
    ports: ["8501:8501"]
    environment: {API_URL: "http://api:8000"}
    depends_on: [api]
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.14.1
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:///mlflow.db
    ports: ["5000:5000"]
volumes: {fraud-data: {}}
