apiVersion: apps/v1
kind: Deployment
metadata: {name: fraud-dashboard}
spec:
  replicas: 1
  selector: {matchLabels: {app: fraud-dashboard}}
  template:
    metadata: {labels: {app: fraud-dashboard}}
    spec:
      containers:
        - name: dashboard
          image: fraud-dashboard:latest
          imagePullPolicy: Never
          ports: [{containerPort: 8501}]
          env: [{name: API_URL, value: "http://fraud-api:8000"}]
---
apiVersion: v1
kind: Service
metadata: {name: fraud-dashboard}
spec:
  type: NodePort
  selector: {app: fraud-dashboard}
  ports: [{port: 8501, targetPort: 8501, nodePort: 30501}]
